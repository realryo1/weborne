# Builds weborne and publishes web/ to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# GitHub Pages cannot send the COOP/COEP headers SharedArrayBuffer needs;
# web/sw.js adds them from a service worker (the page reloads itself once
# on the first visit). It also caches the app so it opens offline.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Vet
        working-directory: go
        run: |
          go vet ./internal/weborne/...
          GOOS=js GOARCH=wasm go vet ./cmd/weborne-wasm

      - name: Build weborne.wasm
        working-directory: go
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o ../web/weborne.wasm ./cmd/weborne-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../web/wasm_exec.js

      # Only @ffmpeg/core is needed here; skipping install scripts keeps the
      # usb package (a test-only native dependency) from building.
      - name: Fetch ffmpeg.wasm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p web/ffmpeg
          cp node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.js node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.wasm web/ffmpeg/

      # A new version makes the service worker cache the app afresh.
      - name: Stamp the service worker
        run: sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::12}';/" web/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
